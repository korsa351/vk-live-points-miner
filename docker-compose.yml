services:
  vk-miner:
    build: .
    container_name: vk-live-miner
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      - ./cookies:/app/cookies
      - ./logs:/app/logs
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    stop_grace_period: 45s
